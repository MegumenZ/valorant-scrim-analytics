name: CI / CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate-and-build:
    name: Type Check, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          TURSO_DATABASE_URL: "file:./data/test.db"
          AUTH_SECRET: "mock-test-auth-secret-for-ci-build-32-chars"
          DISCORD_CLIENT_ID: "mock_discord_client_id"
          DISCORD_CLIENT_SECRET: "mock_discord_client_secret"
          DISCORD_REDIRECT_URI: "http://localhost:3000/api/auth/discord/callback"
          NEXT_TELEMETRY_DISABLED: 1
